# Keeps the NER-SMART demo instance on Render's free plan awake.
#
# Render free web services spin down after ~15 minutes without traffic, and the
# next visitor waits 30-60s for a cold start. A request every 10 minutes keeps
# the demo warm for judges and reviewers.
#
# Note: GitHub can delay scheduled workflows during busy periods, so this is a
# best-effort keep-alive. Open the site once before a live demo regardless.

name: Keep demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          HEALTH_URL: https://ner-smart-vujs.onrender.com/health
        run: |
          set -uo pipefail
          # Retry a few times: a cold start can take up to ~60s to answer.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
              --max-time 90 --retry 2 --retry-delay 5 "$HEALTH_URL" || true)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              echo
              exit 0
            fi
            sleep 20
          done
          echo "::error::NER-SMART health check did not return 200"
          exit 1
